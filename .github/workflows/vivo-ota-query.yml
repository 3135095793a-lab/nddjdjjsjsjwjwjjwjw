name: vivo-ota-query

on:
  workflow_dispatch:
    inputs:
      sw_versions:
        description: 'Comma-separated base SW versions'
        required: false
        default: '14.0.12.0.W10,14.0.13.1.W10,14.0.8.7.W10,14.0.1.0.W50'

jobs:
  ota:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Clone tracker repo
        run: git clone --depth 1 https://github.com/mytiantian001/VIVO-OTA-Tracker.git C:\tracker
        shell: pwsh
      - name: Run OTA query (PD2353/V2353A full package)
        shell: pwsh
        run: |
          $vers = "${{ github.event.inputs.sw_versions }}".Split(',')
          cd C:\tracker
          $all = @()
          foreach ($v in $vers) {
            $v = $v.Trim()
            if (-not $v) { continue }
            Write-Host "===== QUERY BASE VERSION: $v ====="
            $jargs = @('-Djava.net.preferIPv4Stack=true','-DDEVICE_TYPE=phone','-DMODEL_SW_VER=PD2353','-DDEVICE_MODEL=V2353A',("-DSW_VERSION=$v"),'-DANDROID_VER=14','-DSNP=A0000000000000A','-DIS_FULL=true','-Dhttps.protocols=TLSv1.2','-jar','unidbg-android-0.9.10-SNAPSHOT.jar')
            $r = & .\jre\bin\java.exe @jargs 2>&1 | Out-String
            Write-Host $r
            $all += "===== BASE $v =====`r`n" + $r
          }
          $all -join "`r`n" | Out-File -Encoding utf8 C:\tracker\ota-result.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ota-result
          path: C:\tracker\ota-result.txt
