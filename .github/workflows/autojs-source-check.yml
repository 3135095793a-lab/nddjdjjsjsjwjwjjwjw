name: AutoJs pinned source patch check (NOT Android build)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - name: Python regression tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify exact upstream source and patch
        run: python3 scripts/verify_autojs_bridge.py --output "$RUNNER_TEMP/autojs-source-verification"
